openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Site monitoring and alerting API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sites
    description: Monitored site operations
  - name: checks
    description: Check result operations
  - name: alerts
    description: Alert operations
  - name: config
    description: Alert configuration operations
  - name: servers
    description: Server vitals monitoring operations
  - name: magento
    description: Magento store data operations
  - name: users
    description: User management operations
  - name: deployments
    description: Production deployment history operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List monitored sites
      description: Returns all monitored sites with current status
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteWithStatus"

  /sites/{siteId}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a single site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Site details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteWithStatus"
        "404":
          description: Site not found

    put:
      operationId: updateSite
      tags: [sites]
      summary: Update site settings
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteInput"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteWithStatus"

  /sites/{siteId}/check:
    post:
      operationId: triggerCheck
      tags: [sites]
      summary: Trigger a manual check for a site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResultResponse"

  /sites/{siteId}/checks:
    get:
      operationId: getCheckHistory
      tags: [checks]
      summary: Get check history for a site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
          description: Number of hours of history to return
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Check history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckHistoryResponse"

  /alerts/{alertId}/incident-analysis:
    post:
      operationId: analyzeAlertIncident
      tags: [alerts]
      summary: Run AI analysis on the incident timeline captured with an alert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI incident analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertIncidentAnalysis"
        "400":
          description: Alert has no timeline
        "404":
          description: Alert not found
        "503":
          description: AI analysis is not configured

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"

  /config:
    get:
      operationId: getAlertConfig
      tags: [config]
      summary: Get alert configuration
      responses:
        "200":
          description: Alert config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfigResponse"

    put:
      operationId: updateAlertConfig
      tags: [config]
      summary: Update alert configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfigResponse"

  /config/test-smtp:
    post:
      operationId: testSmtpConnection
      tags: [config]
      summary: Test SMTP connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestSmtpInput"
      responses:
        "200":
          description: SMTP test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"

  /config/test-email:
    post:
      operationId: sendTestEmail
      tags: [config]
      summary: Send a test email to verify delivery
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestSmtpInput"
      responses:
        "200":
          description: Test email result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"

  /config/test-slack:
    post:
      operationId: testSlackConnection
      tags: [config]
      summary: Test Slack webhook
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slackBotToken:
                  type: string
                slackChannel:
                  type: string
      responses:
        "200":
          description: Slack test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"

  /config/test-whatsapp:
    post:
      operationId: testWhatsAppConnection
      tags: [config]
      summary: Test WhatsApp connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                whatsappApiToken:
                  type: string
                whatsappPhoneNumberId:
                  type: string
                testRecipient:
                  type: string
              required:
                - testRecipient
      responses:
        "200":
          description: WhatsApp test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"

  /config/magento:
    get:
      operationId: getMagentoConfig
      tags: [config]
      summary: Get Magento connection configuration
      responses:
        "200":
          description: Magento config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagentoConfigResponse"
    put:
      operationId: updateMagentoConfig
      tags: [config]
      summary: Update Magento connection configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMagentoConfigInput"
      responses:
        "200":
          description: Updated Magento config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagentoConfigResponse"

  /config/test-magento:
    post:
      operationId: testMagentoConnection
      tags: [config]
      summary: Test Magento API connection
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMagentoConfigInput"
      responses:
        "200":
          description: Magento test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestMagentoResponse"

  /config/server-alerts:
    get:
      operationId: getServerAlertConfig
      tags: [config]
      summary: Get server alert threshold configuration
      responses:
        "200":
          description: Server alert config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerAlertConfigResponse"
    put:
      operationId: updateServerAlertConfig
      tags: [config]
      summary: Update server alert threshold configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerAlertConfigInput"
      responses:
        "200":
          description: Updated server alert config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerAlertConfigResponse"

  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List monitored servers
      responses:
        "200":
          description: List of servers with latest metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerWithMetrics"
    post:
      operationId: createServer
      tags: [servers]
      summary: Register a new server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerInput"
      responses:
        "201":
          description: Created server with API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerCreateResponse"

  /servers/{serverId}:
    get:
      operationId: getServer
      tags: [servers]
      summary: Get server details
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerWithMetrics"
        "404":
          description: Server not found
    put:
      operationId: updateServer
      tags: [servers]
      summary: Update server name or hostname
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                hostname:
                  type: string
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerWithMetrics"
        "404":
          description: Server not found
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Delete a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /servers/{serverId}/regenerate-key:
    post:
      operationId: regenerateServerKey
      tags: [servers]
      summary: Regenerate API key for a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
        "404":
          description: Server not found

  /servers/{serverId}/metrics:
    get:
      operationId: getServerMetrics
      tags: [servers]
      summary: Get server metrics history
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Number of hours of history
      responses:
        "200":
          description: Metrics history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerMetric"

  /servers/{serverId}/log-snapshots:
    get:
      operationId: getServerLogSnapshots
      tags: [servers]
      summary: Get recent sanitized performance logs
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 6
            minimum: 1
            maximum: 24
          description: Number of hours of log history
      responses:
        "200":
          description: Sanitized performance log snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerLogSnapshot"

  /servers/{serverId}/meta-status:
    get:
      operationId: getServerMetaStatus
      tags: [servers]
      summary: Get Meta and Facebook feed status from sanitized logs
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 6
            minimum: 1
            maximum: 24
          description: Number of hours of log history
      responses:
        "200":
          description: Meta and Facebook feed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaFeedStatus"
        "404":
          description: Server not found

  /servers/{serverId}/log-summary:
    get:
      operationId: getServerLogSummary
      tags: [servers]
      summary: Get analyzed log summary for the dashboard
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 6
            minimum: 1
            maximum: 24
          description: Number of hours of log history
      responses:
        "200":
          description: Analyzed log summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerLogSummary"
        "404":
          description: Server not found

  /servers/{serverId}/log-snapshots/export:
    get:
      operationId: exportServerLogSnapshots
      tags: [servers]
      summary: Download sanitized server log snapshots
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 6
            minimum: 1
            maximum: 24
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv, pdf]
            default: json
      responses:
        "200":
          description: Downloadable sanitized log export
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Server not found

  /servers/{serverId}/waf-events:
    get:
      operationId: getServerWafEvents
      tags: [servers]
      summary: Get recent AWS WAF events
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 168
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Recent normalized AWS WAF events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerWafEvent"

  /servers/{serverId}/incident-analysis:
    post:
      operationId: analyzeServerIncident
      tags: [servers]
      summary: Analyze recent server performance logs with AI
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentAnalysisInput"
      responses:
        "200":
          description: AI incident analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentAnalysis"
        "400":
          description: Invalid analysis window
        "502":
          description: AI provider rejected the bounded analysis request
        "503":
          description: AI analysis is not configured

  /magento/stats:
    get:
      operationId: getMagentoStats
      tags: [magento]
      summary: Get order and cart statistics
      responses:
        "200":
          description: Order and cart stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagentoStats"

  /magento/orders:
    get:
      operationId: getMagentoOrders
      tags: [magento]
      summary: Get recent orders
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MagentoOrder"

  /magento/carts:
    get:
      operationId: getMagentoCarts
      tags: [magento]
      summary: Get abandoned carts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Abandoned carts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MagentoCart"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid input
        "409":
          description: Username already exists

  /users/{userId}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user role or reset password
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Cannot delete self
        "404":
          description: User not found

  /magento/sync:
    get:
      operationId: getMagentoSyncStatus
      tags: [magento]
      summary: Get last sync status
      responses:
        "200":
          description: Sync logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MagentoSyncLog"

  /deployment-systems:
    get:
      operationId: listDeploymentSystems
      tags: [deployments]
      summary: List tracked deployment systems
      responses:
        "200":
          description: Deployment systems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeploymentSystem"
    post:
      operationId: createDeploymentSystem
      tags: [deployments]
      summary: Create a tracked deployment system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentSystemInput"
      responses:
        "201":
          description: Created deployment system. The webhook secret is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentSystemWithSecret"

  /deployment-systems/{systemId}/rotate-secret:
    post:
      operationId: rotateDeploymentSystemSecret
      tags: [deployments]
      summary: Rotate a deployment webhook secret
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rotated webhook secret. The secret is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponse"

  /deployments:
    get:
      operationId: listDeployments
      tags: [deployments]
      summary: List production deployments
      parameters:
        - name: system
          in: query
          required: false
          schema:
            type: string
        - name: environment
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [running, successful, failed, canceled, unknown]
        - name: branch
          in: query
          required: false
          schema:
            type: string
        - name: deployer
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Filtered deployment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentListResponse"

  /deployments/{deploymentId}:
    get:
      operationId: getDeployment
      tags: [deployments]
      summary: Get deployment details
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deployment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "404":
          description: Deployment not found

  /webhooks/gitlab/{systemKey}:
    post:
      operationId: receiveGitlabDeploymentWebhook
      tags: [deployments]
      summary: Receive a GitLab deployment webhook
      parameters:
        - name: systemKey
          in: path
          required: true
          schema:
            type: string
        - name: X-Gitlab-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcceptedResponse"
        "401":
          description: Invalid webhook token

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DeploymentSystem:
      type: object
      properties:
        id:
          type: integer
        systemKey:
          type: string
        name:
          type: string
        provider:
          type: string
        projectPath:
          type: string
          nullable: true
        defaultEnvironment:
          type: string
        isActive:
          type: boolean
        lastWebhookAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - systemKey
        - name
        - provider
        - defaultEnvironment
        - isActive
        - createdAt
        - updatedAt

    CreateDeploymentSystemInput:
      type: object
      properties:
        systemKey:
          type: string
          minLength: 2
        name:
          type: string
          minLength: 2
        provider:
          type: string
          default: gitlab
        projectPath:
          type: string
          nullable: true
