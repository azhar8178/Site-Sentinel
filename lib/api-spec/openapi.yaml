openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Site monitoring and alerting API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sites
    description: Monitored site operations
  - name: checks
    description: Check result operations
  - name: alerts
    description: Alert operations
  - name: config
    description: Alert configuration operations
  - name: servers
    description: Server vitals monitoring operations
  - name: magento
    description: Magento store data operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List monitored sites
      description: Returns all monitored sites with current status
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteWithStatus"

  /sites/{siteId}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a single site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Site details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteWithStatus"
        "404":
          description: Site not found

    put:
      operationId: updateSite
      tags: [sites]
      summary: Update site settings
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteInput"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteWithStatus"

  /sites/{siteId}/check:
    post:
      operationId: triggerCheck
      tags: [sites]
      summary: Trigger a manual check for a site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResultResponse"

  /sites/{siteId}/checks:
    get:
      operationId: getCheckHistory
      tags: [checks]
      summary: Get check history for a site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
          description: Number of hours of history to return
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Check history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckHistoryResponse"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"

  /config:
    get:
      operationId: getAlertConfig
      tags: [config]
      summary: Get alert configuration
      responses:
        "200":
          description: Alert config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfigResponse"

    put:
      operationId: updateAlertConfig
      tags: [config]
      summary: Update alert configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfigResponse"

  /config/test-smtp:
    post:
      operationId: testSmtpConnection
      tags: [config]
      summary: Test SMTP connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestSmtpInput"
      responses:
        "200":
          description: SMTP test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSmtpResponse"

  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List monitored servers
      responses:
        "200":
          description: List of servers with latest metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerWithMetrics"
    post:
      operationId: createServer
      tags: [servers]
      summary: Register a new server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerInput"
      responses:
        "201":
          description: Created server with API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerCreateResponse"

  /servers/{serverId}:
    get:
      operationId: getServer
      tags: [servers]
      summary: Get server details
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerWithMetrics"
        "404":
          description: Server not found
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Delete a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /servers/{serverId}/metrics:
    get:
      operationId: getServerMetrics
      tags: [servers]
      summary: Get server metrics history
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Number of hours of history
      responses:
        "200":
          description: Metrics history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerMetric"

  /magento/stats:
    get:
      operationId: getMagentoStats
      tags: [magento]
      summary: Get order and cart statistics
      responses:
        "200":
          description: Order and cart stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagentoStats"

  /magento/orders:
    get:
      operationId: getMagentoOrders
      tags: [magento]
      summary: Get recent orders
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MagentoOrder"

  /magento/carts:
    get:
      operationId: getMagentoCarts
      tags: [magento]
      summary: Get abandoned carts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Abandoned carts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MagentoCart"

  /magento/sync:
    get:
      operationId: getMagentoSyncStatus
      tags: [magento]
      summary: Get last sync status
      responses:
        "200":
          description: Sync logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MagentoSyncLog"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SiteWithStatus:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        isActive:
          type: boolean
        currentStatus:
          type: string
          enum: [up, down, slow, unknown]
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        lastResponseTimeMs:
          type: integer
          nullable: true
        slowThresholdMs:
          type: integer
        consecutiveFailures:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - url
        - isActive
        - currentStatus
        - slowThresholdMs
        - consecutiveFailures
        - createdAt
        - updatedAt

    UpdateSiteInput:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        isActive:
          type: boolean
        slowThresholdMs:
          type: integer

    CheckResultResponse:
      type: object
      properties:
        id:
          type: integer
        siteId:
          type: integer
        statusCode:
          type: integer
          nullable: true
        responseTimeMs:
          type: integer
          nullable: true
        isUp:
          type: boolean
        errorMessage:
          type: string
          nullable: true
        checkedAt:
          type: string
          format: date-time
      required:
        - id
        - siteId
        - isUp
        - checkedAt

    CheckHistoryResponse:
      type: object
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckResultResponse"
        total:
          type: integer
      required:
        - checks
        - total

    AlertResponse:
      type: object
      properties:
        id:
          type: integer
        siteId:
          type: integer
        siteName:
          type: string
        siteUrl:
          type: string
        alertType:
          type: string
          enum: [downtime, slow_response, recovery]
        message:
          type: string
        responseTimeMs:
          type: integer
          nullable: true
        statusCode:
          type: integer
          nullable: true
        emailSent:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - siteId
        - siteName
        - siteUrl
        - alertType
        - message
        - emailSent
        - createdAt

    AlertListResponse:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertResponse"
        total:
          type: integer
      required:
        - alerts
        - total

    AlertConfigResponse:
      type: object
      properties:
        id:
          type: integer
        recipientEmails:
          type: string
        senderEmail:
          type: string
        isEnabled:
          type: boolean
        smtpHost:
          type: string
        smtpPort:
          type: integer
        smtpUsername:
          type: string
        smtpPassword:
          type: string
        smtpSecure:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - recipientEmails
        - senderEmail
        - isEnabled
        - smtpHost
        - smtpPort
        - smtpUsername
        - smtpPassword
        - smtpSecure
        - updatedAt

    UpdateAlertConfigInput:
      type: object
      properties:
        recipientEmails:
          type: string
        senderEmail:
          type: string
        isEnabled:
          type: boolean
        smtpHost:
          type: string
        smtpPort:
          type: integer
        smtpUsername:
          type: string
        smtpPassword:
          type: string
        smtpSecure:
          type: boolean

    TestSmtpInput:
      type: object
      properties:
        smtpHost:
          type: string
        smtpPort:
          type: integer
        smtpUsername:
          type: string
        smtpPassword:
          type: string
        smtpSecure:
          type: boolean
      required:
        - smtpHost

    TestSmtpResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
      required:
        - success

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    ServerMetric:
      type: object
      properties:
        id:
          type: integer
        serverId:
          type: integer
        cpuPercent:
          type: number
        memUsedBytes:
          type: number
        memTotalBytes:
          type: number
        diskUsedBytes:
          type: number
        diskTotalBytes:
          type: number
        netRxBytes:
          type: number
        netTxBytes:
          type: number
        loadAvg1m:
          type: number
        loadAvg5m:
          type: number
        loadAvg15m:
          type: number
        recordedAt:
          type: string
          format: date-time
      required:
        - id
        - serverId
        - cpuPercent
        - memUsedBytes
        - memTotalBytes
        - diskUsedBytes
        - diskTotalBytes
        - netRxBytes
        - netTxBytes
        - loadAvg1m
        - loadAvg5m
        - loadAvg15m
        - recordedAt

    ServerWithMetrics:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        hostname:
          type: string
        isActive:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        latestMetrics:
          nullable: true
          $ref: "#/components/schemas/ServerMetric"
      required:
        - id
        - name
        - hostname
        - isActive
        - createdAt

    ServerCreateResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        hostname:
          type: string
        apiKey:
          type: string
          description: Only returned once at creation
        isActive:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - hostname
        - apiKey
        - isActive
        - createdAt

    CreateServerInput:
      type: object
      properties:
        name:
          type: string
        hostname:
          type: string
      required:
        - name
        - hostname

    MagentoStats:
      type: object
      properties:
        today:
          type: object
          properties:
            orders:
              type: integer
            revenue:
              type: number
          required: [orders, revenue]
        week:
          type: object
          properties:
            orders:
              type: integer
            revenue:
              type: number
          required: [orders, revenue]
        carts:
          type: object
          properties:
            active:
              type: integer
            activeValue:
              type: number
            abandoned:
              type: integer
            abandonedValue:
              type: number
            abandonmentRate:
              type: integer
          required: [active, activeValue, abandoned, abandonedValue, abandonmentRate]
      required: [today, week, carts]

    MagentoOrder:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        incrementId:
          type: string
        status:
          type: string
        grandTotal:
          type: number
        currency:
          type: string
        customerEmail:
          type: string
          nullable: true
        customerFirstname:
          type: string
          nullable: true
        customerLastname:
          type: string
          nullable: true
        itemsCount:
          type: integer
        storeId:
          type: integer
        orderCreatedAt:
          type: string
          format: date-time
        syncedAt:
          type: string
          format: date-time
      required:
        - id
        - orderId
        - incrementId
        - status
        - grandTotal
        - currency
        - itemsCount
        - storeId
        - orderCreatedAt
        - syncedAt

    MagentoCart:
      type: object
      properties:
        id:
          type: integer
        quoteId:
          type: integer
        customerEmail:
          type: string
          nullable: true
        customerFirstname:
          type: string
          nullable: true
        customerLastname:
          type: string
          nullable: true
        isActive:
          type: boolean
        itemsCount:
          type: integer
        grandTotal:
          type: number
        currency:
          type: string
        storeId:
          type: integer
        cartCreatedAt:
          type: string
          format: date-time
        cartUpdatedAt:
          type: string
          format: date-time
        syncedAt:
          type: string
          format: date-time
      required:
        - id
        - quoteId
        - isActive
        - itemsCount
        - grandTotal
        - currency
        - storeId
        - cartCreatedAt
        - cartUpdatedAt
        - syncedAt

    MagentoSyncLog:
      type: object
      properties:
        id:
          type: integer
        syncType:
          type: string
        status:
          type: string
        recordsFetched:
          type: integer
        durationMs:
          type: integer
        error:
          type: string
          nullable: true
        syncedAt:
          type: string
          format: date-time
      required:
        - id
        - syncType
        - status
        - recordsFetched
        - durationMs
        - syncedAt
