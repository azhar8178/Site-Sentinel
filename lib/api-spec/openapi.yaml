openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Site monitoring and alerting API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sites
    description: Monitored site operations
  - name: checks
    description: Check result operations
  - name: alerts
    description: Alert operations
  - name: config
    description: Alert configuration operations
  - name: servers
    description: Server vitals monitoring operations
  - name: magento
    description: Magento store data operations
  - name: users
    description: User management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List monitored sites
      description: Returns all monitored sites with current status
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteWithStatus"

  /sites/{siteId}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a single site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Site details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteWithStatus"
        "404":
          description: Site not found

    put:
      operationId: updateSite
      tags: [sites]
      summary: Update site settings
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteInput"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteWithStatus"

  /sites/{siteId}/check:
    post:
      operationId: triggerCheck
      tags: [sites]
      summary: Trigger a manual check for a site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResultResponse"

  /sites/{siteId}/checks:
    get:
      operationId: getCheckHistory
      tags: [checks]
      summary: Get check history for a site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
          description: Number of hours of history to return
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Check history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckHistoryResponse"

  /alerts/{alertId}/incident-analysis:
    post:
      operationId: analyzeAlertIncident
      tags: [alerts]
      summary: Run AI analysis on the incident timeline captured with an alert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI incident analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertIncidentAnalysis"
        "400":
          description: Alert has no timeline
        "404":
          description: Alert not found
        "503":
          description: AI analysis is not configured

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"

  /config:
    get:
      operationId: getAlertConfig
      tags: [config]
      summary: Get alert configuration
      responses:
        "200":
          description: Alert config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfigResponse"

    put:
      operationId: updateAlertConfig
      tags: [config]
      summary: Update alert configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfigResponse"

  /config/test-smtp:
    post:
      operationId: testSmtpConnection
      tags: [config]
      summary: Test SMTP connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestSmtpInput"
      responses:
        "200":
          description: SMTP test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"

  /config/test-email:
    post:
      operationId: sendTestEmail
      tags: [config]
      summary: Send a test email to verify delivery
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestSmtpInput"
      responses:
        "200":
          description: Test email result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"

  /config/test-slack:
    post:
      operationId: testSlackConnection
      tags: [config]
      summary: Test Slack webhook
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slackBotToken:
                  type: string
                slackChannel:
                  type: string
      responses:
        "200":
          description: Slack test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"

  /config/test-whatsapp:
    post:
      operationId: testWhatsAppConnection
      tags: [config]
      summary: Test WhatsApp connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                whatsappApiToken:
                  type: string
                whatsappPhoneNumberId:
                  type: string
                testRecipient:
                  type: string
              required:
                - testRecipient
      responses:
        "200":
          description: WhatsApp test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResponse"

  /config/magento:
    get:
      operationId: getMagentoConfig
      tags: [config]
      summary: Get Magento connection configuration
      responses:
        "200":
          description: Magento config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagentoConfigResponse"
    put:
      operationId: updateMagentoConfig
      tags: [config]
      summary: Update Magento connection configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMagentoConfigInput"
      responses:
        "200":
          description: Updated Magento config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagentoConfigResponse"

  /config/test-magento:
    post:
      operationId: testMagentoConnection
      tags: [config]
      summary: Test Magento API connection
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMagentoConfigInput"
      responses:
        "200":
          description: Magento test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestMagentoResponse"

  /config/server-alerts:
    get:
      operationId: getServerAlertConfig
      tags: [config]
      summary: Get server alert threshold configuration
      responses:
        "200":
          description: Server alert config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerAlertConfigResponse"
    put:
      operationId: updateServerAlertConfig
      tags: [config]
      summary: Update server alert threshold configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerAlertConfigInput"
      responses:
        "200":
          description: Updated server alert config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerAlertConfigResponse"

  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List monitored servers
      responses:
        "200":
          description: List of servers with latest metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerWithMetrics"
    post:
      operationId: createServer
      tags: [servers]
      summary: Register a new server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerInput"
      responses:
        "201":
          description: Created server with API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerCreateResponse"

  /servers/{serverId}:
    get:
      operationId: getServer
      tags: [servers]
      summary: Get server details
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerWithMetrics"
        "404":
          description: Server not found
    put:
      operationId: updateServer
      tags: [servers]
      summary: Update server name or hostname
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                hostname:
                  type: string
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerWithMetrics"
        "404":
          description: Server not found
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Delete a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /servers/{serverId}/regenerate-key:
    post:
      operationId: regenerateServerKey
      tags: [servers]
      summary: Regenerate API key for a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
        "404":
          description: Server not found

  /servers/{serverId}/metrics:
    get:
      operationId: getServerMetrics
      tags: [servers]
      summary: Get server metrics history
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Number of hours of history
      responses:
        "200":
          description: Metrics history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerMetric"

  /servers/{serverId}/log-snapshots:
    get:
      operationId: getServerLogSnapshots
      tags: [servers]
      summary: Get recent sanitized performance logs
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 6
            minimum: 1
            maximum: 24
          description: Number of hours of log history
      responses:
        "200":
          description: Sanitized performance log snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerLogSnapshot"

  /servers/{serverId}/incident-analysis:
    post:
      operationId: analyzeServerIncident
      tags: [servers]
      summary: Analyze recent server performance logs with AI
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentAnalysisInput"
      responses:
        "200":
          description: AI incident analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentAnalysis"
        "400":
          description: Invalid analysis window
        "503":
          description: AI analysis is not configured

  /magento/stats:
    get:
      operationId: getMagentoStats
      tags: [magento]
      summary: Get order and cart statistics
      responses:
        "200":
          description: Order and cart stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagentoStats"

  /magento/orders:
    get:
      operationId: getMagentoOrders
      tags: [magento]
      summary: Get recent orders
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MagentoOrder"

  /magento/carts:
    get:
      operationId: getMagentoCarts
      tags: [magento]
      summary: Get abandoned carts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Abandoned carts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MagentoCart"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid input
        "409":
          description: Username already exists

  /users/{userId}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user role or reset password
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Cannot delete self
        "404":
          description: User not found

  /magento/sync:
    get:
      operationId: getMagentoSyncStatus
      tags: [magento]
      summary: Get last sync status
      responses:
        "200":
          description: Sync logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MagentoSyncLog"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SiteWithStatus:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        isActive:
          type: boolean
        currentStatus:
          type: string
          enum: [up, down, slow, unknown]
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        lastResponseTimeMs:
          type: integer
          nullable: true
        slowThresholdMs:
          type: integer
        consecutiveFailures:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - url
        - isActive
        - currentStatus
        - slowThresholdMs
        - consecutiveFailures
        - createdAt
        - updatedAt

    UpdateSiteInput:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        isActive:
          type: boolean
        slowThresholdMs:
          type: integer

    CheckResultResponse:
      type: object
      properties:
        id:
          type: integer
        siteId:
          type: integer
        statusCode:
          type: integer
          nullable: true
        responseTimeMs:
          type: integer
          nullable: true
        isUp:
          type: boolean
        errorMessage:
          type: string
          nullable: true
        checkedAt:
          type: string
          format: date-time
      required:
        - id
        - siteId
        - isUp
        - checkedAt

    CheckHistoryResponse:
      type: object
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckResultResponse"
        total:
          type: integer
      required:
        - checks
        - total

    AlertResponse:
      type: object
      properties:
        id:
          type: integer
        siteId:
          type: integer
          nullable: true
        serverId:
          type: integer
          nullable: true
        siteName:
          type: string
        siteUrl:
          type: string
        serverName:
          type: string
        serverHostname:
          type: string
        alertType:
          type: string
          enum: [downtime, slow_response, recovery, cpu_high, ram_high, disk_high, server_offline, server_recovery]
        message:
          type: string
        responseTimeMs:
          type: integer
          nullable: true
        statusCode:
          type: integer
          nullable: true
        emailSent:
          type: boolean
        hasTimeline:
          type: boolean
          description: Whether this alert has a captured incident timeline available for AI analysis
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - siteName
        - siteUrl
        - serverName
        - serverHostname
        - alertType
        - message
        - emailSent
        - hasTimeline
        - createdAt

    AlertIncidentAnalysis:
      type: object
      properties:
        analysis:
          type: string
          description: Markdown-formatted AI analysis of the incident
        generatedAt:
          type: string
          format: date-time
        snapshotCount:
          type: integer
        metricsCount:
          type: integer
      required:
        - analysis
        - generatedAt
        - snapshotCount
        - metricsCount

    AlertListResponse:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertResponse"
        total:
          type: integer
      required:
        - alerts
        - total

    AlertConfigResponse:
      type: object
      properties:
        id:
          type: integer
        recipientEmails:
          type: string
        senderEmail:
          type: string
        isEnabled:
          type: boolean
        smtpHost:
          type: string
        smtpPort:
          type: integer
        smtpUsername:
          type: string
        smtpPassword:
          type: string
        smtpSecure:
          type: boolean
        slackEnabled:
          type: boolean
        slackBotToken:
          type: string
        slackChannel:
          type: string
        whatsappEnabled:
          type: boolean
        whatsappApiToken:
          type: string
        whatsappPhoneNumberId:
          type: string
        whatsappRecipients:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - recipientEmails
        - senderEmail
        - isEnabled
        - smtpHost
        - smtpPort
        - smtpUsername
        - smtpPassword
        - smtpSecure
        - slackEnabled
        - slackBotToken
        - slackChannel
        - whatsappEnabled
        - whatsappApiToken
        - whatsappPhoneNumberId
        - whatsappRecipients
        - updatedAt

    UpdateAlertConfigInput:
      type: object
      properties:
        recipientEmails:
          type: string
        senderEmail:
          type: string
        isEnabled:
          type: boolean
        smtpHost:
          type: string
        smtpPort:
          type: integer
        smtpUsername:
          type: string
        smtpPassword:
          type: string
        smtpSecure:
          type: boolean
        slackEnabled:
          type: boolean
        slackBotToken:
          type: string
        slackChannel:
          type: string
        whatsappEnabled:
          type: boolean
        whatsappApiToken:
          type: string
        whatsappPhoneNumberId:
          type: string
        whatsappRecipients:
          type: string

    TestSmtpInput:
      type: object
      properties:
        smtpHost:
          type: string
        smtpPort:
          type: integer
        smtpUsername:
          type: string
        smtpPassword:
          type: string
        smtpSecure:
          type: boolean
        senderEmail:
          type: string
        recipientEmails:
          type: string

    TestConnectionResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
      required:
        - success

    TestMagentoResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        stores:
          type: string
      required:
        - success

    MagentoConfigResponse:
      type: object
      properties:
        id:
          type: integer
        apiUrl:
          type: string
        adminUser:
          type: string
        adminPass:
          type: string
        apiToken:
          type: string
        isEnabled:
          type: boolean
        lastTestAt:
          type: string
          format: date-time
          nullable: true
        lastTestStatus:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - apiUrl
        - adminUser
        - adminPass
        - apiToken
        - isEnabled
        - updatedAt

    UpdateMagentoConfigInput:
      type: object
      properties:
        apiUrl:
          type: string
        adminUser:
          type: string
        adminPass:
          type: string
        apiToken:
          type: string
        isEnabled:
          type: boolean

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    ServerMetric:
      type: object
      properties:
        id:
          type: integer
        serverId:
          type: integer
        cpuPercent:
          type: number
        memUsedBytes:
          type: number
        memTotalBytes:
          type: number
        diskUsedBytes:
          type: number
        diskTotalBytes:
          type: number
        netRxBytes:
          type: number
        netTxBytes:
          type: number
        loadAvg1m:
          type: number
        loadAvg5m:
          type: number
        loadAvg15m:
          type: number
        processCount:
          type: integer
          nullable: true
        connectionCount:
          type: integer
          nullable: true
        httpConnectionCount:
          type: integer
          nullable: true
        topProcesses:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
        phpFpm:
          type: object
          nullable: true
          additionalProperties: true
        mysql:
          type: object
          nullable: true
          additionalProperties: true
        nginx:
          type: object
