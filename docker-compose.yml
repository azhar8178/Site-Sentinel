services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: site_monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: changeme_db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    restart: always
    depends_on:
      - postgres
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
